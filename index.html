<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planning Imagerie</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">
      <button type="button" id="btnPlanningHome" class="topbar-title-btn" title="Revenir à la vue planning, quel que soit l'écran en cours">Planning Imagerie</button>
      <span id="fileSyncStatus" class="file-sync-status"></span>
      <button type="button" id="btnWeekLock" class="week-lock-btn"></button>
    </div>
    <div class="week-nav">
      <button id="prevWeek" title="Semaine précédente">&larr;</button>
      <span id="weekLabel" class="popover-anchor" title="Cliquer pour ajouter une annotation à cette semaine">Semaine du ...</span>
      <button id="nextWeek" title="Semaine suivante">&rarr;</button>
      <button id="btnCurrentWeek" class="btn-today" title="Revenir à la semaine actuelle">Aujourd'hui</button>
      <button id="btnTrame" class="btn-accent2" title="Spécialités de vacation et planning de base récurrent">Trame</button>
    </div>
    <div class="actions">
      <button id="btnManageStaff" class="btn-accent">Gestion Personnel</button>
      <button id="btnConges" class="btn-accent3">Congés</button>
      <button id="btnStats" class="btn-accent4">Stats</button>
      <div class="more-menu-wrap">
        <button id="btnMoreMenu" class="btn-gear" title="Plus d'options">⚙</button>
        <div id="moreMenu" class="dropdown-menu hidden">
          <button type="button" id="btnFileSync">Synchro GitHub</button>
          <button type="button" id="btnImportAri">Importer extract ARI (absences)</button>
          <button type="button" id="btnImportTrame">Importer trame personnel</button>
          <button type="button" id="btnResyncTrame">Resynchroniser la trame</button>
          <button type="button" id="btnCustomize">Personnalisation</button>
          <button type="button" id="btnExport">Exporter (JSON)</button>
          <button type="button" id="btnImport">Importer (JSON)</button>
          <button type="button" id="btnReset">Réinitialiser le planning</button>
        </div>
      </div>
      <input type="file" id="fileInput" accept="application/json" hidden>
      <input type="file" id="ariFileInput" accept=".xlsx" hidden>
    </div>
  </header>

  <main>
    <div class="planning-column">
      <div id="trameSubNav" class="trame-subnav hidden">
        <button type="button" class="trame-tab" data-trame-view="personnel">Trame Personnel</button>
        <button type="button" class="trame-tab" data-trame-view="specs">Trame Vacation</button>
      </div>

      <div id="weekCongesBar" class="week-conges-bar hidden"></div>
      <div class="table-wrap" id="tableWrap">
        <table id="planningTable"></table>
      </div>

      <div id="validationZone" class="validation-zone"></div>

      <div id="congesView" class="hidden"></div>

      <div id="statsView" class="hidden"></div>

      <div id="tramePersonnelView" class="hidden"></div>
    </div>

    <aside id="staffPanel">
      <h2>Personnel</h2>
      <div class="legend" id="legend"></div>
      <ul id="staffList"></ul>
    </aside>
  </main>

  <div id="assignPopover" class="popover hidden"></div>
  <div id="congeHalfDayMenu" class="dropdown-menu hidden"></div>

  <div id="staffModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2>Gestion du personnel</h2>
        <span class="close-btn" id="staffModalClose">×</span>
      </div>
      <div class="modal-body" id="staffModalBody"></div>
    </div>
  </div>

  <div id="fileSyncModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2>Synchro GitHub</h2>
        <span class="close-btn" id="fileSyncModalClose">×</span>
      </div>
      <div class="modal-body" id="fileSyncModalBody"></div>
    </div>
  </div>

  <div id="ariImportModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2>Importer extract ARI (absences)</h2>
        <span class="close-btn" id="ariImportModalClose">×</span>
      </div>
      <div class="modal-body" id="ariImportModalBody"></div>
    </div>
  </div>

  <div id="trameImportModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2>Importer trame personnel</h2>
        <span class="close-btn" id="trameImportModalClose">×</span>
      </div>
      <div class="modal-body" id="trameImportModalBody"></div>
    </div>
  </div>

  <div id="customizeModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2>Personnalisation</h2>
        <span class="close-btn" id="customizeModalClose">×</span>
      </div>
      <div class="modal-body" id="customizeModalBody"></div>
    </div>
  </div>

  <!-- SheetJS (23/07/2026) -- seule dépendance externe de tout le projet, nécessaire pour lire un
       vrai fichier .xlsx côté navigateur (le format .xlsx est une archive ZIP+XML, pas quelque
       chose de raisonnable à re-coder à la main). Version figée (pas de "@latest") pour ne jamais
       changer de comportement sans qu'on s'en rende compte. Voir CLAUDE.md pour la justification. -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
